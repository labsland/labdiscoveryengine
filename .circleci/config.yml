version: 2.1

jobs:
  build:
    parameters:
      python_version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python_version >>-node
      - image: cimg/redis:6.2.6
    steps:
      - run:
          name: Check out exact public source revision
          command: |
            # This repository is public. Avoid a stale injected SSH deploy key;
            # fetch the exact pipeline commit without credentials or trust edits.
            [[ "$CIRCLE_SHA1" =~ ^[0-9a-f]{40}$ ]]
            git init .
            git remote add origin https://github.com/labsland/labdiscoveryengine.git
            git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Install JavaScript dependencies
          command: cd labdiscoveryengine/static && npm install
      - run:
          name: Build assets
          command: . devrc && flask assets build
      - run:
          name: Run tests
          command: pytest tests/

workflows:
  version: 2
  build_and_test:
    jobs:
      - build:
          name: unit-tests-cpython<< matrix.python_version >>
          matrix:
            parameters:
              python_version: ["3.8", "3.9", "3.10", "3.11"]
